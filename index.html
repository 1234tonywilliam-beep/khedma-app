<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برنامج الخدمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --navy:#0F2343; --navy-2:#1B3A63;
  --gold:#B8933D; --gold-light:#E4C878;
  --ink:#20242E; --ink-soft:#565B68;
  --cream:#EDE7D6; --line:#D8CFAE; --card:#FFFEFA;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{height:100%;}
body{
  height:100%; font-family:'Tajawal',sans-serif; background:#0A1626; color:var(--ink);
  display:flex; align-items:center; justify-content:center; padding:20px 10px;
}
.phone{
  width:100%; max-width:400px; height:min(840px,92vh);
  background:var(--cream); border-radius:34px; border:8px solid #241E17;
  box-shadow:0 20px 50px rgba(0,0,0,.35); overflow:hidden; display:flex; flex-direction:column;
}
.topbar{ background:var(--navy); color:#F4EDD8; padding:16px 18px; flex-shrink:0; }
.topbar h1{ font-family:'Aref Ruqaa', serif; font-size:20px; }
.screen{ flex:1; overflow-y:auto; padding:20px 18px; display:none; }
.screen.active{ display:flex; flex-direction:column; }
label{ font-size:13px; color:var(--ink-soft); margin:10px 0 4px; display:block; }
input, select{
  width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
  background:var(--card); font-family:'Tajawal'; font-size:14px; color:var(--ink);
}
.btn{
  margin-top:18px; background:var(--navy); color:var(--gold-light); border:none; padding:13px;
  border-radius:10px; font-family:'Tajawal'; font-weight:700; font-size:15px; cursor:pointer;
}
.btn.secondary{ background:transparent; color:var(--navy); border:1px solid var(--navy); margin-top:8px; }
.err{ color:#A32D2D; font-size:12.5px; margin-top:10px; display:none; }
.switch-link{ text-align:center; margin-top:16px; font-size:13px; color:var(--navy); text-decoration:underline; cursor:pointer; }
.form-title{ font-family:'Aref Ruqaa'; font-size:22px; color:var(--navy); margin-bottom:4px; }
.form-sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:8px; }
.saint-card{ border-radius:14px; overflow:hidden; margin-bottom:14px; border:2px solid var(--gold); }
.card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
.hero-name{ font-family:'Aref Ruqaa'; font-size:24px; color:var(--navy); }
.hero-sub{ font-size:13.5px; color:var(--ink-soft); margin-top:6px; line-height:1.9; }
.hero-sub b{ color:var(--ink); }
.loader{ text-align:center; padding:40px 0; color:var(--ink-soft); font-size:13px; }
</style>
</head>
<body>

<div class="phone">
  <div class="topbar"><h1>برنامج الخدمة — كنيسة الشهيد مارمرقس</h1></div>

  <!-- شاشة التحميل -->
  <div class="screen active" data-screen="loading">
    <div class="loader">جاري التحميل...</div>
  </div>

  <!-- تسجيل دخول -->
  <div class="screen" data-screen="login">
    <div class="form-title">تسجيل الدخول</div>
    <div class="form-sub">ادخل برقم تليفونك وكلمة السر</div>
    <label>رقم التليفون</label>
    <input id="login-phone" type="tel" placeholder="01xxxxxxxxx">
    <label>كلمة السر</label>
    <input id="login-pass" type="password">
    <div class="err" id="login-err"></div>
    <button class="btn" onclick="doLogin()">دخول</button>
    <div class="switch-link" onclick="go('register')">مش مسجل؟ سجل حساب جديد</div>
  </div>

  <!-- تسجيل جديد -->
  <div class="screen" data-screen="register">
    <div class="form-title">تسجيل حساب جديد</div>
    <label>الاسم بالكامل</label>
    <input id="reg-name" type="text">
    <label>اسم الأسرة اللي بتخدم فيها</label>
    <input id="reg-family" type="text">
    <label>اسم أمين الأسرة</label>
    <input id="reg-ameen" type="text">
    <label>رقم التليفون</label>
    <input id="reg-phone" type="tel" placeholder="01xxxxxxxxx">
    <label>كلمة السر</label>
    <input id="reg-pass" type="password">
    <div class="err" id="reg-err"></div>
    <button class="btn" onclick="doRegister()">إنشاء الحساب</button>
    <div class="switch-link" onclick="go('login')">عندك حساب؟ سجل دخول</div>
  </div>

  <!-- الرئيسية -->
  <div class="screen" data-screen="home">
    <div class="saint-card">
      <svg viewBox="0 0 200 110" width="100%" height="110">
        <rect width="200" height="110" fill="var(--navy)"/>
        <circle cx="100" cy="34" r="22" fill="none" stroke="var(--gold-light)" stroke-width="2"/>
        <circle cx="100" cy="34" r="18" fill="var(--gold)" opacity="0.9"/>
        <path d="M80 112 C80 78 86 62 100 62 C114 62 120 78 120 112 Z" fill="var(--navy-2)" stroke="var(--gold)" stroke-width="1.5"/>
        <circle cx="100" cy="46" r="13" fill="#F1E3C0"/>
        <text x="100" y="104" text-anchor="middle" font-family="Aref Ruqaa" font-size="9" fill="var(--gold-light)">القديس مارمرقس الرسول</text>
      </svg>
    </div>
    <div class="card">
      <div class="hero-name" id="home-name">—</div>
      <div class="hero-sub">
        <b>الأسرة:</b> <span id="home-family">—</span><br>
        <b>أمين الأسرة:</b> <span id="home-ameen">—</span>
      </div>
    </div>
    <div class="card">
      <div class="hero-sub"><b>اجتماع الخدام:</b> كل جمعة — 7:00 مساءً</div>
      <div class="hero-sub"><b>القداس الشهري:</b> أول أحد — 8:00 صباحاً</div>
    </div>
    <button class="btn secondary" onclick="doLogout()">تسجيل الخروج</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAZeqphx-VMZyp7qvuZ1Vcl--jor9UTwBQ",
  authDomain: "stmark-5521a.firebaseapp.com",
  projectId: "stmark-5521a",
  storageBucket: "stmark-5521a.firebasestorage.app",
  messagingSenderId: "543714814352",
  appId: "1:543714814352:web:b219fcb5b4a52489912b15"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function go(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', s.dataset.screen===name));
}
function phoneToEmail(phone){
  return phone.replace(/\D/g,'') + '@khedma-app.local';
}
function showErr(id, msg){
  const el = document.getElementById(id);
  el.textContent = msg; el.style.display = 'block';
}
function friendlyError(code){
  const map = {
    'auth/email-already-in-use':'الرقم ده مسجل قبل كده، جرب تسجيل الدخول',
    'auth/invalid-email':'رقم التليفون غير صحيح',
    'auth/weak-password':'كلمة السر لازم تكون 6 أحرف على الأقل',
    'auth/user-not-found':'الرقم ده مش مسجل',
    'auth/wrong-password':'كلمة السر غلط',
    'auth/invalid-credential':'رقم التليفون أو كلمة السر غلط'
  };
  return map[code] || 'حصل خطأ، حاول تاني';
}
function doRegister(){
  const name = document.getElementById('reg-name').value.trim();
  const family = document.getElementById('reg-family').value.trim();
  const ameen = document.getElementById('reg-ameen').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();
  const pass = document.getElementById('reg-pass').value;
  document.getElementById('reg-err').style.display='none';
  if(!name || !family || !ameen || !phone || !pass){
    showErr('reg-err','من فضلك املا كل الخانات'); return;
  }
  auth.createUserWithEmailAndPassword(phoneToEmail(phone), pass)
    .then(cred => db.collection('users').doc(cred.user.uid).set({
      name, family_name: family, ameen_name: ameen, phone,
      role: 'khadem', created_at: new Date().toISOString()
    }))
    .catch(e => showErr('reg-err', friendlyError(e.code)));
}
function doLogin(){
  const phone = document.getElementById('login-phone').value.trim();
  const pass = document.getElementById('login-pass').value;
  document.getElementById('login-err').style.display='none';
  if(!phone || !pass){ showErr('login-err','من فضلك اكتب الرقم وكلمة السر'); return; }
  auth.signInWithEmailAndPassword(phoneToEmail(phone), pass)
    .catch(e => showErr('login-err', friendlyError(e.code)));
}
function doLogout(){ auth.signOut(); }

let resolved = false;
auth.onAuthStateChanged(user => {
  resolved = true;
  if(user){
    db.collection('users').doc(user.uid).get().then(doc => {
      const d = doc.data() || {};
      document.getElementById('home-name').textContent = d.name || '(بيانات ناقصة)';
      document.getElementById('home-family').textContent = d.family_name || '—';
      document.getElementById('home-ameen').textContent = d.ameen_name || '—';
      go('home');
    }).catch(e => {
      go('login');
      showErr('login-err', 'دخلت بنجاح بس حصلت مشكلة في جلب بياناتك: ' + (e.message || e.code || 'خطأ غير معروف'));
    });
  } else {
    go('login');
  }
});
setTimeout(() => {
  if(!resolved){
    document.querySelector('[data-screen="loading"]').innerHTML =
      '<div class="loader">تعذر الاتصال بالإنترنت أو الاتصال بطيء جداً.<br><br>' +
      '<button class="btn" onclick="location.reload()">حاول تاني</button></div>';
  }
}, 6000);
</script>
</body>
</html>
